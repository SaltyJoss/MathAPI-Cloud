        if (window.parent && typeof(window.parent.postMessage) === 'function') {
    	    window.parent.postMessage({type: 'cf-height-change', value: current}, '*');
        }
        last = current;
      }
      setTimeout(checkHeight, 200);
    };
    checkHeight();
})();
 
})();
        </script>
